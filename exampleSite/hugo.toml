# Vitrine's own documentation, built with Vitrine: the theme's example site. From the theme's folder:
#   hugo server -s exampleSite
baseURL = "https://vitrine.maxfettinger.com/"
locale = "en"
title = "Vitrine"
theme = "vitrine"
themesDir = "../.."
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

# The settings Vitrine needs but a theme can't set for a site (Hugo only merges params, menus, output formats and
# media types from a theme's config):
# - only Markdown files are pages, so an example's example.html can sit in a folder next to its page
# - code colours as CSS classes, so light and dark mode can colour them
# - "On this page" lists the h2 and h3 headings
[contentTypes]
  [contentTypes.'text/markdown']

[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# For maths: formulas reach MathJax untouched by Markdown (docs/writing/maths)
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[menus]
  [[menus.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 10
  [[menus.main]]
    name = "Examples"
    pageRef = "/examples"
    weight = 20

[params]
  description = "A Hugo theme for documentation, with examples that run on the page next to their code."
  version = "1.0.3"
  repo = "https://github.com/maxfettinger/vitrine"
  editPath = "https://github.com/maxfettinger/vitrine/edit/main/exampleSite/content/"
  footer = "MIT licence"
  # The photo viewer's own CSS, for the example that uses it
  stylesheets = ["https://cdn.jsdelivr.net/npm/dialog-lightbox@0.3.1/dist/dialog-lightbox.css"]

  [params.importmap]
    dialog-lightbox = "https://cdn.jsdelivr.net/npm/dialog-lightbox@0.3.1/dist/dialog-lightbox.js"
