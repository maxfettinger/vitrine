{{- /* A code block with its file name or language above it and a copy button.
       Context: dict with code (text), lang (for highlighting), file (the label; the language if empty) and options
       (optional: Hugo's highlighting options, such as hl_lines or linenos, from the code fence's attributes). */ -}}
<figure class="code">
  <figcaption class="code-head">
    <span>{{ .file | default .lang }}</span>
    <button type="button" class="code-copy" aria-label="Copy code" title="Copy code">{{ partial "icon.html" "copy" }}{{ partial "icon.html" "check" }}</button>
  </figcaption>
  {{ transform.Highlight (strings.TrimSpace .code) .lang (.options | default dict) }}
</figure>
